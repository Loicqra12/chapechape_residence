name: chapechape_client
description: Client application for ChapeChape Residence rentals

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et gestion des données
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^7.6.4

  # UI et design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  image_picker: ^1.0.7
  lottie: ^2.7.0
  confetti: ^0.7.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.6.0
  carousel_slider: ^4.2.1
  flutter_carousel_widget: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  video_player: ^2.8.2
  flutter_animate: ^4.2.0+1
  animated_bottom_navigation_bar: ^1.3.0
  flutter_easyloading: ^3.0.5

  # Réseau et API
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  http: ^1.3.0
  # connectivity_plus: ^5.0.2  # Temporairement désactivé en raison de problèmes de compatibilité avec SDK 35

  # Services
  path_provider: ^2.1.1
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  google_maps_flutter: ^2.5.0
  uuid: ^4.5.1
  # geolocator: ^9.0.2 # Temporairement désactivé en raison de problèmes de compatibilité avec Android SDK
  js: ^0.6.7
  webview_flutter: ^4.5.0
  intl_phone_number_input: ^0.7.3+1
  share_plus: ^7.1.0
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  app_settings: ^5.1.1

  # Authentification et sécurité
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0

  # Tools
  flutter_native_splash: ^2.3.4
  flutter_launcher_icons: ^0.13.1
  freezed: ^2.4.5
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

  # Navigation
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  assets:
    # Logos
    - assets/logos/
    - assets/logos/partners/
    # Images
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/backgrounds/
    - assets/images/flags/
    - assets/images/map/
    - assets/images/onboarding/
    - assets/images/payment/
    - assets/images/placeholders/
    - assets/images/residences/
    - assets/images/residences/apartments/
    - assets/images/residences/luxury/
    - assets/images/residences/studios/
    - assets/images/residences/villas/

    # Icons
    - assets/icons/
    - assets/icons/amenities/
    - assets/icons/categories/
    - .env
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/splash_logo.png
  android: true
  ios: true
