name: chapechape_client
description: Client application for ChapeChape Residence rentals

publish_to: "none"

version: 1.9.0+23

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et gestion des données
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^7.6.4
  socket_io_client: ^2.0.2

  # UI et design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Packages ChapeChape
  chape_core:
    path: ../packages/chape_core
  flutter_svg: ^2.0.17
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  image_picker: ^1.0.7
  lottie: ^2.7.0
  confetti: ^0.7.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.6.0
  carousel_slider: ^4.2.1
  flutter_carousel_widget: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  url_launcher: ^6.2.4
  video_player: ^2.8.2
  animated_bottom_navigation_bar: ^1.3.0
  flutter_easyloading: ^3.0.5
  timeago: ^3.6.0
  smooth_page_indicator: ^1.1.0
  expandable_text: ^2.3.0
  # Réseau et API
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  http: ^1.3.0
  # connectivity_plus: ^5.0.2  # Temporairement désactivé en raison de problèmes de compatibilité avec SDK 35

  # Services
  path_provider: ^2.1.1
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  google_maps_flutter: ^2.5.0
  
  # ChapeChape packages
  chapechape_maps:
    path: ../packages/chapechape_maps
  uuid: ^4.5.1
  geolocator: ^10.1.0  # Version mise à jour pour compatibilité avec les derniers SDK Android
  js: ^0.6.7
  webview_flutter: ^4.5.0
  intl_phone_number_input: ^0.7.3+1
  share_plus: ^7.1.0
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  app_settings: ^5.1.1

  # Authentification et sécurité
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0
  onesignal_flutter: ^5.0.4

  # Tools
  flutter_native_splash: ^2.3.4
  flutter_launcher_icons: ^0.13.1
  freezed: ^2.4.5
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

  # Navigation
  go_router: ^13.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_sign_in: ^6.2.2
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  flutter_facebook_auth: ^6.0.3
  # disk_space: ^0.2.1  # Temporairement désactivé en raison de problèmes de compatibilité avec Android Gradle Plugin

  # Cloudinary pour la gestion des images
  cloudinary_public: ^0.23.1
  crypto: ^3.0.3
  http_parser: ^4.0.2
  flutter_map_marker_cluster: ^1.4.0
  google_maps_cluster_manager: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Logos
    - assets/logos/
    - assets/logos/partners/
    # Images
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/backgrounds/
    - assets/images/flags/
    - assets/images/map/
    - assets/images/onboarding/
    - assets/images/payment/
    - assets/images/placeholders/
    - assets/images/residences/
    - assets/images/residences/apartments/
    - assets/images/residences/luxury/
    - assets/images/empty_states/
    - assets/images/residences/studios/
    - assets/images/residences/villas/

    # Icons
    - assets/icons/
    - assets/icons/amenities/
    - assets/icons/categories/
    - assets/data/
    # Legal Documents
    - assets/legal/
    # Play Store Assets
    - assets/playstore/
    - .env
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/splash_logo.png
  android: true
  ios: true
