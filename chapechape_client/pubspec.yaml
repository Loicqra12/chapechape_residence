name: chapechape_client
description: "Application de réservation de résidences"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et gestion des données
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI et design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.6.0
  flutter_carousel_widget: ^2.1.2
  video_player: ^2.8.2

  # Navigation
  go_router: ^13.2.0

  # Réseau et API
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  pretty_dio_logger: ^1.3.1

  # Utilitaires
  intl: ^0.19.0
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  js: ^0.6.7

  # Authentification et sécurité
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  assets:
    # Images
    - assets/images/
    - assets/images/onboarding/
    - assets/images/backgrounds/
    - assets/images/residences/
    - assets/images/residences/apartments/
    - assets/images/residences/luxury/
    - assets/images/residences/studios/
    - assets/images/residences/villas/
    - assets/images/placeholders/
    - assets/images/flags/
    - assets/images/map/
    - assets/images/payment/
    - assets/images/video_thumbnails/
    
    # Logos
    - assets/logos/
    - assets/logos/partners/
    
    # Videos
    - assets/videos/
    
    # Icons
    - assets/icons/
    - assets/icons/amenities/
    - assets/icons/categories/
    
    # Configuration
    - .env
    - .env.example
    - web/.env
    - web/.env.example
    
    # Fonts
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/splash_logo.png
  android: true
  ios: true