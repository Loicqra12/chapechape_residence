// ✅ Le bloc buildscript doit être tout en haut
buildscript {
    ext {
        kotlin_version = '2.1.0'
    }
    repositories {
        google()
        mavenCentral()
    }
}

// ✅ Ensuite les plugins
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter plugin appliqué après Android et Kotlin
}

// ✅ Chargement des propriétés locales
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// ✅ Configuration de signature de production
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    println "INFO: Keystore properties loaded successfully"
} else {
    println "WARNING: key.properties file not found - signing will be skipped"
}

// ✅ Appliquer les correctifs personnalisés si nécessaires
apply from: "fix_plugin.gradle"

android {
    namespace = "com.chapechape.client"
    // 36 : exigence app_links ; aligné avec le module partenaire
    compileSdk = 36
    ndkVersion = project.hasProperty('ndkVersion') ? project.ndkVersion : "25.1.8937393"
    
    // Force all Android libraries to use SDK 23 as minimum
    buildToolsVersion = "33.0.2"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }
    
    // Ajout pour résoudre les problèmes de manifest merger
    aaptOptions {
        noCompress "tflite"
    }

    defaultConfig {
        applicationId "com.chapechape.client"
        minSdkVersion = flutter.minSdkVersion // Version minimale requise pour Firebase Auth
        targetSdk = 36 // Exigence Google Play : Android 16 (API 36) — dès 31 août 2026
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Configuration OneSignal
        manifestPlaceholders = [
            onesignal_app_id: '43531899-4645-4f52-a2bf-f4e4a4095513',
            onesignal_channel_id: "b80d5093-5e1f-480e-a42f-a0ccb009e3f2",
            onesignal_firebase_default_notification_icon: "@drawable/ic_stat_notification",
            // Flutter 3 + embedding v2 : éviter io.flutter.app.FlutterApplication (obsolète / crashs OEM)
            applicationName: "androidx.multidex.MultiDexApplication"
        ]
    }

    signingConfigs {
        release {
            keyAlias 'upload'
            keyPassword 'chapechape2024'
            storeFile file('upload-keystore.jks')
            storePassword 'chapechape2024'
        }
    }

    buildTypes {
        release {
            // ✅ Réactiver la signature pour Google Play Console
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.annotation:annotation:1.7.0'
            // >= 1.13 : EditorInfoCompat.setStylusHandwritingEnabled (clavier Flutter)
            force 'androidx.core:core:1.13.1'
            force 'androidx.activity:activity:1.8.2'
            force 'com.google.android.gms:play-services-base:18.2.0'
            force 'com.google.android.gms:play-services-tasks:18.0.2'
            force 'com.google.android.gms:play-services-basement:18.2.0'
            force 'androidx.lifecycle:lifecycle-common:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
            // Forcer la version du plugin Flutter Android Lifecycle comme dans le projet partenaire
            force 'io.flutter:flutter_plugin_android_lifecycle:2.0.17'
            force 'com.google.android.gms:play-services-location:21.0.1'

            exclude group: 'io.flutter.plugins.connectivity', module: 'connectivity_plus'
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.8.2'
    // Ne pas implémenter directement flutter_plugin_android_lifecycle comme dans le projet partenaire
    implementation 'androidx.lifecycle:lifecycle-common:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
}

flutter {
    source = "../.."
}

// Appliquer le plugin Google Services à la fin
apply plugin: 'com.google.gms.google-services'
