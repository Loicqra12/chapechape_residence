pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    def flutterRoot = file(flutterSdkPath)
    
    // Ajout pour gestion des variables flutter absentes dans les plugins
    ext {
        flutterConfig = [:]
        flutterConfig.compileSdkVersion = 34
        flutterConfig.minSdkVersion = 21
        flutterConfig.targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
    }
    
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.google.com' }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

// Ne pas appliquer notre propre flutter.gradle car cela entre en conflit avec le plugin Flutter
apply from: 'repositories.gradle'

include ":app"
