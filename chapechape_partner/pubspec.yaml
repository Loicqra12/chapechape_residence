name: chapechape_partner
description: "Application de gestion pour les partenaires ChapeChape Residence"
publish_to: "none"
version: 1.6.0+13

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  go_router: ^12.0.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  intl: 0.19.0
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  google_maps_flutter: ^2.5.0

  # ChapeChape packages
  chapechape_maps:
    path: ../packages/chapechape_maps
  chape_core:
    path: ../packages/chape_core
  flutter_image_compress: ^2.1.0
  image: ^4.1.3
  socket_io_client: ^2.0.2
  shimmer: ^3.0.0
  timeago: ^3.5.0
  cupertino_icons: ^1.0.2
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  logger: ^2.0.2+1
  url_launcher: ^6.2.1
  package_info_plus: ^4.2.0
  fl_chart: ^0.65.0
  flutter_animate: ^4.5.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_easyloading: ^3.0.5
  animated_bottom_navigation_bar: ^1.3.0
  uuid: ^4.2.1
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  file_picker: ^5.5.0
  table_calendar: ^3.0.9
  permission_handler: ^11.0.1
  camera: ^0.10.5+5
  mime: ^1.0.4
  connectivity_plus: ^5.0.1
  flutter_chat_ui: ^1.6.9
  flutter_chat_types: ^3.6.2
  http: ^1.1.0
  freezed_annotation: ^2.4.1
  logging: ^1.2.0
  provider: ^6.0.5
  # Système de cache local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fpdart: ^1.1.0
  # Temporairement désactivé pour résoudre les problèmes de build avec SDK 34
  # connectivity_plus: ^4.0.1

  onesignal_flutter: ^5.0.4
  flutter_local_notifications: ^17.2.2
  # Cloudinary dependencies
  cloudinary_public: ^0.23.1
  crypto: ^3.0.3
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.6
  mocktail: ^1.0.3
  build_runner: ^2.4.6
  freezed: ^2.4.2
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/backgrounds/
    - assets/images/placeholders/
    - assets/images/payment/
    - assets/images/illustrations/
    - assets/icons/
    - assets/icons/navigation/
    - assets/icons/actions/
    - assets/icons/features/
    - assets/icons/status/
    - assets/icons/amenities/
    - assets/icons/profile/
    - assets/icons/message/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo/logo_primary.png
  android: true
  ios: true
