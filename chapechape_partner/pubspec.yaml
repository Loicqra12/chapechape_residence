name: chapechape_partner
description: "Application de gestion pour les partenaires ChapeChape Residence"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  go_router: ^12.0.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  intl: ^0.18.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  timeago: ^3.5.0
  cupertino_icons: ^1.0.2
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  logger: ^2.0.2+1
  url_launcher: ^6.2.5
  fl_chart: ^0.65.0
  flutter_local_notifications: ^16.3.0
  flutter_animate: ^4.5.0
  uuid: ^4.2.1
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  file_picker: ^6.1.1
  mime: ^1.0.4
  flutter_chat_ui: ^1.6.9
  flutter_chat_types: ^3.6.2
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.6
  mocktail: ^1.0.3
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/backgrounds/
    - assets/images/placeholders/
    - assets/icons/
    - assets/icons/navigation/
    - assets/icons/actions/
    - assets/icons/features/
    - assets/icons/status/
    - assets/icons/amenities/
    - assets/icons/profile/
    - assets/icons/message/
    - assets/fonts/
