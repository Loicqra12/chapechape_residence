// ✅ Le bloc buildscript doit être tout en haut
buildscript {
    ext {
        kotlin_version = '2.1.0'
    }
    repositories {
        google()
        mavenCentral()
    }
}

// ✅ Ensuite les plugins
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ✅ Chargement des propriétés locales
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new Exception("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// Appliquer le fichier de correction des plugins
apply from: 'fix_plugin.gradle'

// ✅ Configuration de signature de production
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('android/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.chapechape.chapechape_partner"
    compileSdk = 36
    ndkVersion = "28.0.12433566"
    
    // Force all Android libraries to use SDK 23 as minimum
    buildToolsVersion = "33.0.2"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }
    
    // Ajout pour résoudre les problèmes de manifest merger
    aaptOptions {
        noCompress "tflite"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.chapechape.chapechape_partner"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion // Version minimale pour être compatible avec les nouvelles APIs
        targetSdk = 36 // Exigence Google Play : Android 16 (API 36) — dès 31 août 2026
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Configuration OneSignal
        manifestPlaceholders = [
            onesignal_app_id: '43531899-4645-4f52-a2bf-f4e4a4095513',
            onesignal_channel_id: "b80d5093-5e1f-480e-a42f-a0ccb009e3f2",
            onesignal_firebase_default_notification_icon: "@drawable/ic_stat_notification",
            applicationName: "androidx.multidex.MultiDexApplication" // Classe d'application valide pour gérer multidex
        ]
    }

    signingConfigs {
        release {
            keyAlias 'upload'
            keyPassword 'chapechape2024'
            storeFile file('upload-keystore.jks')
            storePassword 'chapechape2024'
        }
    }

    buildTypes {
        release {
            // ✅ Réactiver la signature pour Google Play Console
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    configurations.all {
        resolutionStrategy {
            force 'androidx.annotation:annotation:1.7.0'
            // >= 1.13 : EditorInfoCompat (clavier). compileSdk 36 + core 1.13.x OK.
            force 'androidx.core:core:1.13.1'
            force 'com.google.android.gms:play-services-base:18.2.0'
            force 'com.google.android.gms:play-services-tasks:18.0.2'
            force 'com.google.android.gms:play-services-basement:18.2.0'
            // Ajouter cette ligne pour résoudre les problèmes avec JDK Image Transform
            force 'androidx.lifecycle:lifecycle-common:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
            // Force la version du plugin Flutter Android Lifecycle
            force 'io.flutter:flutter_plugin_android_lifecycle:2.0.17' 
            // Exclure les transformations pour connectivity_plus
            exclude group: 'io.flutter.plugins.connectivity', module: 'connectivity_plus'
            force 'com.google.android.gms:play-services-location:21.0.1'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'  // Ajout de la dépendance multidex
}

flutter {
    source = "../.."
}
