plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Appliquer le fichier de correction des plugins
apply from: 'fix_plugin.gradle'

android {
    namespace = "com.chapechape.chapechape_partner"
    compileSdk = 34 // Retour à SDK 34 car le SDK 35 est corrompu
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // Ajouter les options lint directement ici
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.chapechape.chapechape_partner"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 21 // Version minimale pour être compatible avec les nouvelles APIs
        targetSdk = 34 // Cibler une version récente mais stable d'Android
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    
    configurations.all {
        resolutionStrategy {
            force 'androidx.annotation:annotation:1.7.0'
            force 'androidx.core:core:1.12.0'
            force 'com.google.android.gms:play-services-base:18.2.0'
            force 'com.google.android.gms:play-services-tasks:18.0.2'
            force 'com.google.android.gms:play-services-basement:18.2.0'
            // Ajouter cette ligne pour résoudre les problèmes avec JDK Image Transform
            force 'androidx.lifecycle:lifecycle-common:2.6.2'
            force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
            // Force la version du plugin Flutter Android Lifecycle
            force 'io.flutter:flutter_plugin_android_lifecycle:2.0.17' 
            // Exclure les transformations pour connectivity_plus
            exclude group: 'io.flutter.plugins.connectivity', module: 'connectivity_plus'
            // Forcer les versions pour éviter les conflits
            force 'com.google.android.gms:play-services-basement:18.1.0'
            force 'com.google.android.gms:play-services-base:18.1.0'
            force 'com.google.android.gms:play-services-location:21.0.1'
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.core:core:1.12.0'
}

flutter {
    source = "../.."
}
