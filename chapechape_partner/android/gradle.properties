org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Duser.country=FR -Duser.language=fr
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=android-base-common,flutter,bcprov,connectivity_plus,flutter_native_splash
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.14.7-hotspot
android.disableResourceValidation=true
android.enableR8.fullMode=false
android.enableAapt2=true
org.gradle.configureondemand=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Désactiver la transformation JDK qui cause les erreurs
# Suppression des options obsolètes
# android.jetifier.blacklist=bcprov   # Ligne commentée car obsolète
android.suppressUnsupportedCompileSdk=34,35
# Désactiver complètement les transformations JDK pour résoudre les erreurs JDK Image
android.enableJdkImageTransform=false
# Paramètres spécifiques pour résoudre les problèmes de compilation
# android.bundle.enableUncompressedNativeLibs=false  # Option obsolète, supprimée dans AGP 8.1
# android.useNewApkCreator=false  # Option obsolète, supprimée dans AGP 8.0
# Configuration additionnelle pour résoudre les problèmes de transformation JDK
org.gradle.caching=false
kotlin.incremental=false
android.disableResourceCompression=true
android.enableSeparateAnnotationProcessing=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
# Suppression de la ligne aapt2FromMavenOverride qui causait l'erreur
# Ignorer les problèmes avec le lint

# Téléchargements Maven/Google (évite Read timed out)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
