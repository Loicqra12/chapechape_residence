<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#3B82F6"/>
      <stop offset="0.5" style="stop-color:#2563EB"/>
      <stop offset="1" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" fill-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#primaryGradient)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
</svg>
