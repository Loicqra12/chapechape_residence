server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Android App Links — fichier statique (pas le backend Node). Doit être JSON, sans fallback SPA.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Google Play — Data safety / suppression de compte : URL exacte doit répondre 200 avec du HTML valide
    # (évite 500 si le reverse-proxy ou le SPA ne sert pas correctement la route profonde)
    location = /suppression-compte {
        default_type text/html;
        charset utf-8;
        alias /usr/share/nginx/html/suppression-compte/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long uniquement pour bundles hashés (js/css)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache plus court pour images statiques non hashées
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
