server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Android App Links — fichier statique (pas le backend Node). Doit être JSON, sans fallback SPA.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # API (même origine que le site) — évite le blocage CORS navigateur vers api.* depuis presentation.*
    location /api/ {
        proxy_pass https://api.chapechaperesidence.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.chapechaperesidence.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Google Play — Data safety / suppression de compte : URL exacte doit répondre 200 avec du HTML valide
    # (évite 500 si le reverse-proxy ou le SPA ne sert pas correctement la route profonde)
    location = /suppression-compte {
        default_type text/html;
        charset utf-8;
        alias /usr/share/nginx/html/suppression-compte/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Fichiers build Vite (ne jamais retomber sur index.html — sinon MIME « text/html » sur les .js)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
