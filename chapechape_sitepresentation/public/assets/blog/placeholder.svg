<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="placeholderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#placeholderBg)"/>
  
  <!-- ChapeChape logo placeholder -->
  <circle cx="200" cy="125" r="60" fill="#D4AF37" opacity="0.3"/>
  <circle cx="200" cy="125" r="40" fill="#D4AF37" opacity="0.5"/>
  
  <!-- Building icon -->
  <g transform="translate(180, 105)" fill="#D4AF37">
    <rect x="0" y="20" width="8" height="20" rx="1"/>
    <rect x="10" y="15" width="8" height="25" rx="1"/>
    <rect x="20" y="10" width="8" height="30" rx="1"/>
    <rect x="30" y="18" width="8" height="22" rx="1"/>
    
    <!-- Windows -->
    <rect x="2" y="25" width="2" height="3" fill="#1a1a1a"/>
    <rect x="5" y="25" width="2" height="3" fill="#1a1a1a"/>
    <rect x="12" y="20" width="2" height="3" fill="#1a1a1a"/>
    <rect x="15" y="20" width="2" height="3" fill="#1a1a1a"/>
    <rect x="22" y="15" width="2" height="3" fill="#1a1a1a"/>
    <rect x="25" y="15" width="2" height="3" fill="#1a1a1a"/>
    <rect x="32" y="23" width="2" height="3" fill="#1a1a1a"/>
    <rect x="35" y="23" width="2" height="3" fill="#1a1a1a"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="200" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    ChapeChape Residence
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="220" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="12" opacity="0.8">
    Blog & Actualités
  </text>
</svg>
