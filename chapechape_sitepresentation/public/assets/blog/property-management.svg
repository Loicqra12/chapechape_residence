<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="mgmtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#mgmtBg)"/>
  
  <!-- Building -->
  <rect x="150" y="80" width="100" height="120" fill="#4a5568" rx="5"/>
  
  <!-- Building windows -->
  <g fill="#D4AF37" opacity="0.8">
    <rect x="165" y="95" width="12" height="15" rx="2"/>
    <rect x="185" y="95" width="12" height="15" rx="2"/>
    <rect x="205" y="95" width="12" height="15" rx="2"/>
    <rect x="225" y="95" width="12" height="15" rx="2"/>
    
    <rect x="165" y="120" width="12" height="15" rx="2"/>
    <rect x="185" y="120" width="12" height="15" rx="2"/>
    <rect x="205" y="120" width="12" height="15" rx="2"/>
    <rect x="225" y="120" width="12" height="15" rx="2"/>
    
    <rect x="165" y="145" width="12" height="15" rx="2"/>
    <rect x="185" y="145" width="12" height="15" rx="2"/>
    <rect x="205" y="145" width="12" height="15" rx="2"/>
    <rect x="225" y="145" width="12" height="15" rx="2"/>
  </g>
  
  <!-- Door -->
  <rect x="190" y="170" width="20" height="30" fill="#8b4513" rx="2"/>
  <circle cx="205" cy="185" r="1.5" fill="#D4AF37"/>
  
  <!-- Management icons around building -->
  
  <!-- Maintenance tool -->
  <g transform="translate(80, 120)">
    <rect x="0" y="10" width="3" height="20" fill="#D4AF37"/>
    <rect x="-5" y="8" width="13" height="6" fill="#D4AF37" rx="3"/>
    <circle cx="1.5" cy="35" r="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="1.5" y="50" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="8">Maintenance</text>
  </g>
  
  <!-- Money/Finance -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="20" height="12" fill="#D4AF37" rx="2"/>
    <text x="10" y="8" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="6" font-weight="bold">€</text>
    <rect x="2" y="15" width="16" height="10" fill="#D4AF37" opacity="0.7" rx="2"/>
    <rect x="4" y="28" width="12" height="8" fill="#D4AF37" opacity="0.5" rx="2"/>
    <text x="10" y="45" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="8">Finance</text>
  </g>
  
  <!-- Security -->
  <g transform="translate(320, 160)">
    <rect x="0" y="5" width="15" height="12" fill="#D4AF37" rx="2"/>
    <rect x="5" y="0" width="5" height="8" fill="none" stroke="#D4AF37" stroke-width="2" rx="2.5"/>
    <circle cx="7.5" cy="11" r="1" fill="#1a1a1a"/>
    <text x="7.5" y="25" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="8">Sécurité</text>
  </g>
  
  <!-- Tenant services -->
  <g transform="translate(60, 180)">
    <circle cx="8" cy="5" r="4" fill="#D4AF37"/>
    <rect x="3" y="8" width="10" height="12" fill="#D4AF37" rx="2"/>
    <rect x="1" y="12" width="4" height="8" fill="#D4AF37"/>
    <rect x="11" y="12" width="4" height="8" fill="#D4AF37"/>
    <text x="8" y="30" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="8">Services</text>
  </g>
  
  <!-- Arrows connecting services to building -->
  <g stroke="#D4AF37" stroke-width="1" fill="#D4AF37" opacity="0.6">
    <line x1="95" y1="135" x2="140" y2="135"/>
    <path d="M 140 135 L 135 132 L 135 138 Z"/>
    
    <line x1="290" y1="115" x2="260" y2="115"/>
    <path d="M 260 115 L 265 112 L 265 118 Z"/>
    
    <line x1="310" y1="175" x2="260" y2="175"/>
    <path d="M 260 175 L 265 172 L 265 178 Z"/>
    
    <line x1="80" y1="195" x2="140" y2="195"/>
    <path d="M 140 195 L 135 192 L 135 198 Z"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Gestion Locative Professionnelle
  </text>
  
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="50" fill="#374151"/>
</svg>
