<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#docBg)"/>
  
  <!-- Main document -->
  <rect x="80" y="40" width="240" height="170" fill="#fff" stroke="#ddd" stroke-width="2" rx="5"/>
  
  <!-- Document header -->
  <rect x="80" y="40" width="240" height="35" fill="#D4AF37" rx="5 5 0 0"/>
  <text x="200" y="62" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    DOSSIER DE LOCATION
  </text>
  
  <!-- Form fields -->
  <g fill="#333">
    <!-- Personal info section -->
    <text x="100" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Informations personnelles:</text>
    <rect x="100" y="100" width="200" height="12" fill="#f8f9fa" stroke="#ddd" rx="2"/>
    <rect x="100" y="118" width="200" height="12" fill="#f8f9fa" stroke="#ddd" rx="2"/>
    
    <!-- Income section -->
    <text x="100" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Revenus:</text>
    <rect x="100" y="150" width="200" height="12" fill="#f8f9fa" stroke="#ddd" rx="2"/>
    
    <!-- Documents section -->
    <text x="100" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Documents requis:</text>
  </g>
  
  <!-- Checkboxes -->
  <g fill="#D4AF37">
    <rect x="100" y="180" width="8" height="8" rx="1"/>
    <path d="M 102 184 L 104 186 L 106 182" stroke="#fff" stroke-width="1.5" fill="none"/>
    
    <rect x="100" y="192" width="8" height="8" rx="1"/>
    <path d="M 102 196 L 104 198 L 106 194" stroke="#fff" stroke-width="1.5" fill="none"/>
    
    <rect x="200" y="180" width="8" height="8" rx="1"/>
    <path d="M 202 184 L 204 186 L 206 182" stroke="#fff" stroke-width="1.5" fill="none"/>
    
    <rect x="200" y="192" width="8" height="8" rx="1"/>
    <path d="M 202 196 L 204 198 L 206 194" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Document labels -->
  <g fill="#666" font-family="Arial, sans-serif" font-size="8">
    <text x="115" y="187">Pièce d'identité</text>
    <text x="115" y="199">Justificatif revenus</text>
    <text x="215" y="187">Contrat de travail</text>
    <text x="215" y="199">Relevé bancaire</text>
  </g>
  
  <!-- Folder icon -->
  <g transform="translate(30, 80)">
    <rect x="0" y="10" width="35" height="25" fill="#D4AF37" rx="2"/>
    <rect x="5" y="5" width="15" height="8" fill="#D4AF37" rx="2 2 0 0"/>
    <rect x="8" y="18" width="20" height="2" fill="#fff" opacity="0.8"/>
    <rect x="8" y="23" width="15" height="2" fill="#fff" opacity="0.8"/>
    <rect x="8" y="28" width="18" height="2" fill="#fff" opacity="0.8"/>
  </g>
  
  <!-- Key icon -->
  <g transform="translate(340, 90)">
    <circle cx="8" cy="8" r="6" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <rect x="12" y="6" width="15" height="4" fill="#D4AF37" rx="1"/>
    <rect x="25" y="4" width="3" height="2" fill="#D4AF37"/>
    <rect x="25" y="8" width="3" height="2" fill="#D4AF37"/>
  </g>
  
  <!-- Success indicators -->
  <g fill="#28a745">
    <circle cx="60" cy="60" r="12" fill="#28a745" opacity="0.2"/>
    <path d="M 55 60 L 58 63 L 65 56" stroke="#28a745" stroke-width="2" fill="none"/>
    
    <circle cx="340" cy="60" r="12" fill="#28a745" opacity="0.2"/>
    <path d="M 335 60 L 338 63 L 345 56" stroke="#28a745" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Dossier de Location
  </text>
</svg>
