<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="legalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#legalBg)"/>
  
  <!-- Document -->
  <rect x="100" y="50" width="200" height="150" fill="#fff" rx="5"/>
  
  <!-- Document header -->
  <rect x="100" y="50" width="200" height="30" fill="#D4AF37" rx="5 5 0 0"/>
  
  <!-- Scale of justice -->
  <g transform="translate(200, 40)">
    <!-- Base -->
    <rect x="-15" y="15" width="30" height="5" fill="#D4AF37"/>
    <!-- Pole -->
    <rect x="-2" y="-20" width="4" height="35" fill="#D4AF37"/>
    <!-- Balance beam -->
    <rect x="-25" y="-20" width="50" height="3" fill="#D4AF37"/>
    <!-- Left scale -->
    <path d="M -20 -17 L -15 -10 L -25 -10 Z" fill="#D4AF37"/>
    <!-- Right scale -->
    <path d="M 20 -17 L 25 -10 L 15 -10 Z" fill="#D4AF37"/>
    <!-- Chains -->
    <line x1="-20" y1="-17" x2="-20" y2="-20" stroke="#D4AF37" stroke-width="1"/>
    <line x1="20" y1="-17" x2="20" y2="-20" stroke="#D4AF37" stroke-width="1"/>
  </g>
  
  <!-- Document lines -->
  <g fill="#333" opacity="0.7">
    <rect x="120" y="90" width="160" height="3" rx="1"/>
    <rect x="120" y="100" width="140" height="3" rx="1"/>
    <rect x="120" y="110" width="150" height="3" rx="1"/>
    <rect x="120" y="120" width="130" height="3" rx="1"/>
    <rect x="120" y="130" width="160" height="3" rx="1"/>
    <rect x="120" y="140" width="120" height="3" rx="1"/>
    <rect x="120" y="150" width="140" height="3" rx="1"/>
    <rect x="120" y="160" width="110" height="3" rx="1"/>
    <rect x="120" y="170" width="150" height="3" rx="1"/>
  </g>
  
  <!-- Signature area -->
  <rect x="120" y="180" width="80" height="2" fill="#D4AF37"/>
  <text x="160" y="195" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8">
    Signature
  </text>
  
  <!-- Stamp -->
  <circle cx="250" cy="170" r="15" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="250" y="175" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    LEGAL
  </text>
  
  <!-- West Africa map outline -->
  <g transform="translate(50, 180)" fill="#D4AF37" opacity="0.3">
    <path d="M 0 20 Q 10 10 20 15 Q 30 5 40 20 Q 35 30 25 35 Q 15 40 5 35 Q 0 30 0 20 Z"/>
  </g>
  
  <g transform="translate(320, 180)" fill="#D4AF37" opacity="0.3">
    <path d="M 0 20 Q 10 10 20 15 Q 30 5 40 20 Q 35 30 25 35 Q 15 40 5 35 Q 0 30 0 20 Z"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Guide Juridique Location
  </text>
</svg>
