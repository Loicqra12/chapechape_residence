<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="cityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#cityBg)"/>
  
  <!-- City skyline -->
  <g fill="url(#buildingGrad)">
    <!-- Buildings -->
    <rect x="50" y="150" width="30" height="80" rx="2"/>
    <rect x="90" y="120" width="25" height="110" rx="2"/>
    <rect x="125" y="140" width="35" height="90" rx="2"/>
    <rect x="170" y="100" width="40" height="130" rx="2"/>
    <rect x="220" y="130" width="30" height="100" rx="2"/>
    <rect x="260" y="110" width="35" height="120" rx="2"/>
    <rect x="305" y="140" width="25" height="90" rx="2"/>
    <rect x="340" y="160" width="30" height="70" rx="2"/>
  </g>
  
  <!-- Building windows -->
  <g fill="#D4AF37" opacity="0.6">
    <!-- Building 1 -->
    <rect x="55" y="160" width="4" height="6" rx="1"/>
    <rect x="65" y="160" width="4" height="6" rx="1"/>
    <rect x="55" y="180" width="4" height="6" rx="1"/>
    <rect x="65" y="180" width="4" height="6" rx="1"/>
    
    <!-- Building 2 -->
    <rect x="95" y="130" width="4" height="6" rx="1"/>
    <rect x="105" y="130" width="4" height="6" rx="1"/>
    <rect x="95" y="150" width="4" height="6" rx="1"/>
    <rect x="105" y="150" width="4" height="6" rx="1"/>
    
    <!-- Building 3 -->
    <rect x="135" y="150" width="4" height="6" rx="1"/>
    <rect x="145" y="150" width="4" height="6" rx="1"/>
    <rect x="135" y="170" width="4" height="6" rx="1"/>
    <rect x="145" y="170" width="4" height="6" rx="1"/>
    
    <!-- Building 4 (tallest) -->
    <rect x="180" y="110" width="4" height="6" rx="1"/>
    <rect x="190" y="110" width="4" height="6" rx="1"/>
    <rect x="180" y="130" width="4" height="6" rx="1"/>
    <rect x="190" y="130" width="4" height="6" rx="1"/>
    <rect x="180" y="150" width="4" height="6" rx="1"/>
    <rect x="190" y="150" width="4" height="6" rx="1"/>
  </g>
  
  <!-- Construction cranes -->
  <g stroke="#D4AF37" stroke-width="2" fill="none">
    <line x1="300" y1="80" x2="300" y2="40"/>
    <line x1="280" y1="50" x2="320" y2="50"/>
    <line x1="300" y1="50" x2="310" y2="60"/>
    
    <line x1="150" y1="90" x2="150" y2="50"/>
    <line x1="130" y1="60" x2="170" y2="60"/>
    <line x1="150" y1="60" x2="160" y2="70"/>
  </g>
  
  <!-- Investment arrows -->
  <g fill="#D4AF37">
    <path d="M 100 50 L 110 45 L 110 50 L 120 50 L 120 55 L 110 55 L 110 60 Z"/>
    <path d="M 250 60 L 260 55 L 260 60 L 270 60 L 270 65 L 260 65 L 260 70 Z"/>
    <path d="M 350 70 L 360 65 L 360 70 L 370 70 L 370 75 L 360 75 L 360 80 Z"/>
  </g>
  
  <!-- Title -->
  <rect x="0" y="0" width="400" height="35" fill="rgba(15,23,42,0.9)"/>
  <text x="200" y="22" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Quartiers Émergents Abidjan
  </text>
  
  <!-- Ground -->
  <rect x="0" y="230" width="400" height="20" fill="#374151"/>
</svg>
