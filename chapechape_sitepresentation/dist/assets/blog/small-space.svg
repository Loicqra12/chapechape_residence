<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="roomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#roomBg)"/>
  
  <!-- Room walls -->
  <rect x="20" y="40" width="360" height="180" fill="#fff" stroke="#ddd" stroke-width="2"/>
  
  <!-- Floor -->
  <rect x="20" y="180" width="360" height="40" fill="#f5f5f5"/>
  
  <!-- Furniture - Sofa -->
  <rect x="50" y="140" width="80" height="35" fill="#6c757d" rx="5"/>
  <rect x="45" y="135" width="90" height="10" fill="#495057" rx="5"/>
  
  <!-- Coffee table -->
  <rect x="70" y="160" width="40" height="15" fill="#8b4513" rx="2"/>
  
  <!-- Bookshelf -->
  <rect x="300" y="80" width="60" height="100" fill="#654321" rx="3"/>
  <rect x="305" y="85" width="50" height="15" fill="#D4AF37" opacity="0.3"/>
  <rect x="305" y="105" width="50" height="15" fill="#D4AF37" opacity="0.3"/>
  <rect x="305" y="125" width="50" height="15" fill="#D4AF37" opacity="0.3"/>
  <rect x="305" y="145" width="50" height="15" fill="#D4AF37" opacity="0.3"/>
  <rect x="305" y="165" width="50" height="10" fill="#D4AF37" opacity="0.3"/>
  
  <!-- Wall art -->
  <rect x="80" y="60" width="40" height="30" fill="#D4AF37" opacity="0.7" rx="2"/>
  <rect x="140" y="70" width="30" height="20" fill="#D4AF37" opacity="0.5" rx="2"/>
  
  <!-- Window -->
  <rect x="200" y="50" width="80" height="60" fill="#87ceeb" opacity="0.5" stroke="#666" stroke-width="2"/>
  <line x1="240" y1="50" x2="240" y2="110" stroke="#666" stroke-width="1"/>
  <line x1="200" y1="80" x2="280" y2="80" stroke="#666" stroke-width="1"/>
  
  <!-- Plants -->
  <ellipse cx="320" cy="190" rx="8" ry="15" fill="#228b22"/>
  <rect x="315" y="190" width="10" height="20" fill="#8b4513"/>
  
  <ellipse cx="60" cy="185" rx="6" ry="12" fill="#228b22"/>
  <rect x="57" y="185" width="6" height="15" fill="#8b4513"/>
  
  <!-- Title overlay -->
  <rect x="0" y="0" width="400" height="40" fill="rgba(26,26,26,0.8)"/>
  <text x="200" y="25" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Aménagement Petit Espace
  </text>
</svg>
